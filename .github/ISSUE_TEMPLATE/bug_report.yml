name: Bug report
description: Something does not work as expected. One bug per issue.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you got and what you expected.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Environment (production, dev, local), version or release, and the exact place (URL, command, node, server id).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, ids or timestamps. Never paste credentials, tokens or customer personal data; a security issue goes to security@hidenenterprises.com, not here.
  - type: textarea
    id: unusual
    attributes:
      label: Anything unusual and why
      description: If the fix will need something out of the ordinary (a limit, a timing, a new dependency, a change in what is sanctioned automatically), say so here so the release review takes it into account.
